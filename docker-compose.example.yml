services:
  p2000:
    build: .
    container_name: p2000-rtlsdr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "p2000-rtlsdr", "--healthcheck"]
      interval: 90s
      timeout: 10s
      retries: 3
      start_period: 30s
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
    environment:
      MQTT_PASSWORD: change-me
      # OPENCAGE_API_KEY: change-me
