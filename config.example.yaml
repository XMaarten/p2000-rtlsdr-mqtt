version: 1

general:
  log_level: INFO

receiver:
  decoder: multimon
  frequency_mhz: 169.65
  # Device index or, preferably, a stable RTL-SDR serial number.
  device: "00000001"
  gain: auto
  ppm: 0
  sample_rate: 22050
  multimon_demodulator: FLEX
  restart_delay_seconds: 5

  # Experimental: deFLEX currently emits no usable FLEX capcode in its log output.
  # When decoder is "deflex", install/mount deFLEX yourself and set both values below.
  deflex_command:
    - python3
    - /opt/deflex/flex_receiver.py
    - --live
    - --freq
    - "169.65"
    - --driver
    - rtlsdr
    - --log
    - /data/deflex
  deflex_log_file: /data/deflex/169650000.flexdec.log

mqtt:
  host: 192.168.1.10
  port: 1883
  username: p2000
  password: ${MQTT_PASSWORD}
  tls: false
  keepalive: 60
  qos: 1
  base_topic: p2000
  home_assistant_discovery: true
  discovery_prefix: homeassistant

database:
  # Replaceable read-only reference dataset downloaded from p2000-capcodes.
  capcodes_path: /data/capcodes.sqlite3
  # Local writable state: route history, geocode cache and updater metadata.
  runtime_path: /data/runtime.sqlite3
  auto_update: true
  update_interval_hours: 168
  source_url: https://raw.githubusercontent.com/XMaarten/p2000-capcodes/main/data/capcodes.sqlite3
  min_records: 5000

dedupe:
  window_seconds: 30
  max_entries: 5000

global_filters:
  ignore_text:
    - "*TEST*"
    - "*Test*"
  ignore_capcodes: []
  ignore_capcodes_mode: any

geocoding:
  enabled: false
  provider: opencage
  api_key: ${OPENCAGE_API_KEY:-}
  timeout_seconds: 8

routes:
  - id: all
    name: P2000 alle meldingen
    icon: mdi:radio-tower

  - id: alkmaar
    name: P2000 Alkmaar
    icon: mdi:map-marker-alert
    include:
      text:
        - "*alkmaar*"

  - id: grip
    name: P2000 GRIP
    icon: mdi:alert
    include:
      text:
        - "*grip*"

  - id: lifeliners
    name: P2000 Lifeliners
    icon: mdi:helicopter
    include:
      capcodes:
        - "*001420059*"
        - "*000923993*"
